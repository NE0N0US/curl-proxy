<!doctype html>
<html class="artisan artisan-quasar">
	<head>
		<meta charset="utf-8" name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-visual">
		<meta name="format-detection" content="telephone=no">
		<title>URL Artisan</title>
		<link rel="icon" type="image/svg+xml" href="favicon.svg">
		<link rel="manifest" href="manifest.json">
		<meta http-equiv="Content-Security-Policy" content="<% if (ctx.dev) { %> connect-src 'self' *; worker-src 'self' blob:;<% } %>">
	</head>
	<body>
		<script>
			// before Vue
			const html = document.documentElement
			html.classList.add('artisan-' + (localStorage.getItem('color-scheme') ?? 'auto'))
			;[
				'--light-text', '--light-background', '--light-accent',
				'--light-code-syntax', '--light-code-entity', '--light-code-value',
				'--dark-text', '--dark-background', '--dark-accent',
				'--dark-code-syntax', '--dark-code-entity', '--dark-code-value',
			]
				.forEach(name =>
					html.style.setProperty(name, localStorage.getItem(name) || null)
				)
		</script>
		<!-- quasar:entry-point -->
	</body>
</html>
